<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kane's Bioresonance Manual</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #f7f4ef;
      --bg-main: #f2ede5;
      --surface: #ffffff;
      --surface-hover: #faf8f4;
      --surface-active: #eee9df;
      --border: rgba(139, 111, 71, 0.15);
      --border-hover: rgba(139, 111, 71, 0.35);
      --gold: #8b6f47;
      --gold-dim: rgba(139, 111, 71, 0.15);
      --gold-glow: rgba(139, 111, 71, 0.06);
      --cream: #2c2417;
      --cream-dim: rgba(44, 36, 23, 0.5);
      --sage: #4a7a4a;
      --brown: #8b6f47;
      --beneficial: #3a8a4a;
      --detrimental: #b83030;
      --confused: #c49520;
      --phase-blockages: #9e6b3a;
      --phase-energy: #b8942e;
      --phase-strains: #b83030;
      --phase-emotions: #7b68ae;
      --phase-physical: #3a8a4a;
      --phase-detox: #4a7fa0;
      --phase-acupuncture: #b8942e;
      --phase-remedies: #8b6f47;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-deep);
      color: var(--cream);
      font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Sacred Geometry Background */
    .bg-sacred {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.4;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-deep) 70%, transparent 100%);
      padding: 20px 48px 12px;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 16px;
    }

    .logo-mark {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
    }

    .logo-mark circle {
      fill: none;
      stroke: #8b6f47;
      stroke-width: 0.7;
      opacity: 0.6;
    }

    .header-title {
      flex: 1;
    }

    .header-title h1 {
      font-family: 'Cinzel', serif;
      font-weight: 600;
      font-size: 1.6rem;
      color: var(--gold);
      letter-spacing: 2px;
    }

    .header-title p {
      font-size: 0.75rem;
      color: var(--cream-dim);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .search-wrapper {
      position: relative;
      width: 320px;
      flex-shrink: 0;
    }

    .search-wrapper input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--cream);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .search-wrapper input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 20px var(--gold-glow);
    }

    .search-wrapper input::placeholder { color: var(--cream-dim); }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--cream-dim);
      font-size: 0.9rem;
    }

    /* Phase Navigation */
    .phase-nav {
      display: flex;
      gap: 4px;
      padding: 0 48px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      position: sticky;
      top: 90px;
      z-index: 49;
      background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-deep) 80%, transparent 100%);
      padding-bottom: 24px;
    }

    .phase-nav::-webkit-scrollbar { display: none; }

    .phase-btn {
      padding: 8px 20px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: transparent;
      color: var(--cream-dim);
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 1px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s;
    }

    .phase-btn:hover {
      border-color: var(--border-hover);
      color: var(--cream);
      background: var(--surface);
    }

    .phase-btn.active {
      background: var(--gold-dim);
      border-color: var(--gold);
      color: var(--gold);
    }

    .phase-btn .phase-num {
      display: inline-block;
      width: 18px;
      height: 18px;
      line-height: 18px;
      text-align: center;
      border-radius: 50%;
      background: var(--gold-dim);
      font-size: 0.65rem;
      margin-right: 6px;
      font-family: 'Nunito Sans', sans-serif;
    }

    .phase-btn.active .phase-num {
      background: var(--gold);
      color: var(--bg-deep);
    }

    /* Mode Toggle */
    .mode-bar {
      display: flex;
      gap: 8px;
      padding: 0 48px 20px;
      align-items: center;
    }

    .mode-label {
      font-size: 0.7rem;
      color: var(--cream-dim);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-right: 8px;
    }

    .mode-btn {
      padding: 5px 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: transparent;
      color: var(--cream-dim);
      font-family: inherit;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    .mode-btn:hover { border-color: var(--border-hover); color: var(--cream); }
    .mode-btn.active { background: var(--surface-active); border-color: var(--sage); color: var(--sage); }

    /* Main Content */
    main {
      position: relative;
      z-index: 1;
      padding-bottom: 100px;
    }

    /* Row Section */
    .row-section {
      margin-bottom: 36px;
    }

    .row-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 48px;
      margin-bottom: 14px;
    }

    .row-phase-bar {
      width: 4px;
      height: 24px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .row-title {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--cream);
      letter-spacing: 1px;
    }

    .row-count {
      font-size: 0.7rem;
      color: var(--cream-dim);
      margin-left: 4px;
    }

    .row-subtitle {
      font-size: 0.75rem;
      color: var(--cream-dim);
      font-style: italic;
    }

    /* Netflix Horizontal Scroll */
    .row-scroll {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 14px;
      padding: 8px 48px 16px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .row-scroll::-webkit-scrollbar { display: none; }

    /* Cards */
    .card {
      min-width: 230px;
      max-width: 230px;
      height: 160px;
      background: var(--surface);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      scroll-snap-align: start;
      position: relative;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .card:hover {
      transform: scale(1.08);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
      border-color: var(--border-hover);
      z-index: 10;
    }

    .card-accent {
      height: 3px;
      width: 100%;
      flex-shrink: 0;
    }

    .card-body {
      padding: 14px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-badges {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .badge-testing { background: rgba(107, 143, 107, 0.2); color: var(--sage); }
    .badge-asking { background: rgba(123, 104, 174, 0.2); color: #9b88ce; }
    .badge-beneficial { background: rgba(74, 158, 92, 0.15); color: var(--beneficial); }
    .badge-detrimental { background: rgba(196, 64, 64, 0.15); color: var(--detrimental); }
    .badge-confused { background: rgba(212, 168, 67, 0.15); color: var(--confused); }
    .badge-critical { background: rgba(201, 168, 76, 0.2); color: var(--gold); border: 1px solid var(--gold-dim); }

    .card-title {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--cream);
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .card-sub {
      font-size: 0.72rem;
      color: var(--cream-dim);
      margin-top: auto;
    }

    .card-vial {
      font-size: 0.65rem;
      color: var(--sage);
      margin-top: 4px;
      opacity: 0.7;
    }

    /* Detail Panel */
    .detail-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.25);
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .detail-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .detail-panel {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(180deg, #ffffff 0%, #faf8f4 100%);
      border-top: 2px solid var(--gold-dim);
      max-height: 80vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      padding: 0;
    }

    .detail-panel.active {
      transform: translateY(0);
    }

    .detail-header {
      position: sticky;
      top: 0;
      background: linear-gradient(180deg, #ffffff 0%, #ffffff 90%, transparent 100%);
      padding: 24px 48px 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      z-index: 2;
    }

    .detail-header h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      color: var(--gold);
      letter-spacing: 1px;
    }

    .detail-header .detail-sub {
      font-size: 0.8rem;
      color: var(--cream-dim);
      margin-top: 4px;
    }

    .detail-close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--cream);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .detail-close:hover {
      background: var(--surface-hover);
      border-color: var(--gold);
    }

    .detail-tabs {
      display: flex;
      gap: 0;
      padding: 0 48px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .detail-tab {
      padding: 10px 20px;
      background: none;
      border: none;
      color: var(--cream-dim);
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .detail-tab:hover { color: var(--cream); }
    .detail-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

    .detail-content {
      padding: 0 48px 40px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .detail-section {
      background: var(--surface);
      border-radius: 8px;
      padding: 20px;
      border: 1px solid var(--border);
    }

    .detail-section h3 {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      color: var(--gold);
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .detail-section p, .detail-section li {
      font-size: 0.85rem;
      color: var(--cream);
      line-height: 1.7;
    }

    .detail-section ul {
      list-style: none;
      padding: 0;
    }

    .detail-section ul li {
      padding: 4px 0;
      padding-left: 16px;
      position: relative;
    }

    .detail-section ul li::before {
      content: '';
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--gold);
      position: absolute;
      left: 0;
      top: 12px;
    }

    .detail-full {
      grid-column: 1 / -1;
    }

    /* Acu Point Cards */
    .acu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .acu-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .acu-card:hover {
      border-color: var(--gold);
      background: var(--surface-hover);
    }

    .acu-code {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      color: var(--gold);
      font-weight: 700;
    }

    .acu-name {
      font-size: 0.75rem;
      color: var(--cream-dim);
      font-style: italic;
      margin-top: 2px;
    }

    .acu-meridian {
      font-size: 0.65rem;
      color: var(--sage);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 6px;
    }

    .acu-location {
      font-size: 0.75rem;
      color: var(--cream);
      margin-top: 6px;
      line-height: 1.5;
    }

    /* Status Flow Indicator */
    .flow-indicator {
      display: flex;
      align-items: center;
      gap: 0;
      padding: 0 48px;
      margin-bottom: 32px;
    }

    .flow-step {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      font-size: 0.7rem;
      color: var(--cream-dim);
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .flow-step:hover { color: var(--cream); }

    .flow-step.active {
      color: var(--gold);
    }

    .flow-step .flow-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 700;
    }

    .flow-step.active .flow-num {
      border-color: var(--gold);
      background: var(--gold-dim);
      color: var(--gold);
    }

    .flow-line {
      flex: 1;
      height: 1px;
      background: var(--border);
      min-width: 20px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 48px;
      color: var(--cream-dim);
    }

    .empty-state h3 {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      color: var(--gold);
      margin-bottom: 8px;
    }

    /* Search results mode */
    .search-results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
      padding: 0 48px;
    }

    .search-results .card {
      min-width: unset;
      max-width: unset;
    }

    /* Section Divider */
    .section-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 24px 48px 8px;
      margin-top: 16px;
    }

    .section-divider span {
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      color: var(--cream-dim);
      letter-spacing: 3px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .section-divider::before,
    .section-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Responsive */
    @media (max-width: 768px) {
      header { padding: 16px 20px 8px; }
      .header-top { flex-wrap: wrap; }
      .search-wrapper { width: 100%; order: 3; }
      .phase-nav { padding: 0 20px 20px; }
      .row-header { padding: 0 20px; }
      .row-scroll { padding: 8px 20px 16px; gap: 10px; }
      .card { min-width: 180px; max-width: 180px; height: 150px; }
      .detail-header { padding: 20px 20px 12px; }
      .detail-tabs { padding: 0 20px; }
      .detail-content { padding: 0 20px 32px; }
      .detail-grid { grid-template-columns: 1fr; }
      .flow-indicator { padding: 0 20px; overflow-x: auto; }
      .mode-bar { padding: 0 20px 16px; }
      .section-divider { padding: 24px 20px 8px; }
      .search-results { padding: 0 20px; }
    }

    /* Scrollbar */
    .detail-panel::-webkit-scrollbar { width: 6px; }
    .detail-panel::-webkit-scrollbar-track { background: transparent; }
    .detail-panel::-webkit-scrollbar-thumb { background: rgba(139,111,71,0.3); border-radius: 3px; }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .row-section {
      animation: fadeInUp 0.5s ease both;
    }

    .row-section:nth-child(2) { animation-delay: 0.1s; }
    .row-section:nth-child(3) { animation-delay: 0.2s; }
    .row-section:nth-child(4) { animation-delay: 0.3s; }
    .row-section:nth-child(5) { animation-delay: 0.4s; }
    .row-section:nth-child(6) { animation-delay: 0.5s; }
  </style>
</head>

const state = {
  phase: 'all',
  mode: 'all',
  search: '',
  selectedItem: null,
  selectedPoint: null,
  detailTab: 'overview'
};

function getPhaseColor(phaseId) {
  const p = PHASES.find(ph => ph.id === phaseId);
  return p ? p.color : 'var(--gold)';
}

function filterItems() {
  let items = [...ITEMS];
  if (state.phase !== 'all') items = items.filter(i => i.phase === state.phase);
  if (state.mode !== 'all') items = items.filter(i => i.modes.includes(state.mode));
  if (state.search) {
    const q = state.search.toLowerCase();
    items = items.filter(i =>
      i.name.toLowerCase().includes(q) ||
      i.desc.toLowerCase().includes(q) ||
      i.sub.toLowerCase().includes(q) ||
      (i.notes && i.notes.toLowerCase().includes(q)) ||
      i.points.some(p => p.toLowerCase().includes(q))
    );
  }
  return items;
}

function filterPoints() {
  if (!state.search) return ACU_POINTS;
  const q = state.search.toLowerCase();
  return ACU_POINTS.filter(p =>
    p.code.toLowerCase().includes(q) ||
    p.name.toLowerCase().includes(q) ||
    p.english.toLowerCase().includes(q) ||
    p.meridian.toLowerCase().includes(q) ||
    p.use.toLowerCase().includes(q)
  );
}

function renderMain() {
  const main = document.getElementById('main');

  if (state.phase === 'acupuncture') {
    renderAcupuncturePage(main);
    return;
  }

  if (state.phase === 'remedies') {
    renderRemediesPage(main);
    return;
  }

  const items = filterItems();

  if (state.search) {
    // Search results mode - flat grid
    const points = filterPoints();
    main.innerHTML = `
      <div style="padding: 0 48px 16px;">
        <p style="color: var(--cream-dim); font-size: 0.85rem;">
          Found ${items.length} item${items.length !== 1 ? 's' : ''}${points.length ? ` and ${points.length} acupuncture point${points.length !== 1 ? 's' : ''}` : ''} for "<em>${state.search}</em>"
        </p>
      </div>
      <div class="search-results">
        ${items.map(item => renderCard(item)).join('')}
      </div>
      ${points.length ? `
        <div class="section-divider"><span>Acupuncture Points</span></div>
        <div style="padding: 0 48px;">
          <div class="acu-grid">
            ${points.map(p => renderAcuCard(p)).join('')}
          </div>
        </div>
      ` : ''}
    `;
    return;
  }

  // Group items by phase, then subcategory
  const grouped = {};
  items.forEach(item => {
    const key = `${item.phase}|${item.sub}`;
    if (!grouped[key]) grouped[key] = { phase: item.phase, sub: item.sub, items: [] };
    grouped[key].items.push(item);
  });

  const rows = Object.values(grouped).sort((a, b) => {
    const pa = PHASES.findIndex(p => p.id === a.phase);
    const pb = PHASES.findIndex(p => p.id === b.phase);
    return pa - pb || a.sub.localeCompare(b.sub);
  });

  let html = '';
  let lastPhase = '';

  rows.forEach(row => {
    const phase = PHASES.find(p => p.id === row.phase);
    if (row.phase !== lastPhase && state.phase === 'all') {
      html += `
        <div class="section-divider">
          <span>${phase.order}. ${phase.name}</span>
        </div>
        <p style="padding: 0 48px; font-size: 0.8rem; color: var(--cream-dim); margin-bottom: 8px; font-style: italic;">${phase.desc}</p>
      `;
      lastPhase = row.phase;
    }

    html += `
      <div class="row-section">
        <div class="row-header">
          <div class="row-phase-bar" style="background: ${phase.color}"></div>
          <span class="row-title">${row.sub}</span>
          <span class="row-count">(${row.items.length})</span>
        </div>
        <div class="row-scroll">
          ${row.items.map(item => renderCard(item)).join('')}
        </div>
      </div>
    `;
  });

  // Add acupuncture reference section when showing all
  if (state.phase === 'all') {
    html += `
      <div class="section-divider"><span>Key Acupuncture Points</span></div>
      <p style="padding: 0 48px; font-size: 0.8rem; color: var(--cream-dim); margin-bottom: 16px; font-style: italic;">Points that support each bioresonance protocol phase</p>
      <div style="padding: 0 48px;">
        <div class="acu-grid">
          ${ACU_POINTS.filter(p => p.importance === 'critical').map(p => renderAcuCard(p)).join('')}
        </div>
      </div>
    `;

    html += `
      <div class="section-divider"><span>Remedy Categories</span></div>
      <p style="padding: 0 48px; font-size: 0.8rem; color: var(--cream-dim); margin-bottom: 16px; font-style: italic;">Substances tested for beneficial resonance to support the body</p>
      <div class="row-section">
        <div class="row-scroll">
          ${REMEDIES_CATEGORIES.map(cat => `
            <div class="card" style="min-width: 260px; max-width: 260px; height: 180px;" onclick="setPhase('remedies')">
              <div class="card-accent" style="background: var(--brown)"></div>
              <div class="card-body">
                <h3 class="card-title">${cat.name}</h3>
                <p class="card-sub" style="margin-top: 8px;">${cat.desc}</p>
                <p class="card-vial">${cat.items.length} items</p>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  if (!rows.length) {
    html = `
      <div class="empty-state">
        <h3>No items found</h3>
        <p>Try adjusting your filters or search terms.</p>
      </div>
    `;
  }

  main.innerHTML = html;
}

          <p>${point.location}</p>
        </div>
        <div class="detail-section">
          <h3>Importance</h3>
          <p>${point.importance === 'critical' ? 'CRITICAL - use frequently in clinic' : 'Important supporting point'}</p>
          <div style="margin-top: 8px; display: flex; gap: 4px; flex-wrap: wrap;">
            ${point.phases.map(ph => {
              const phase = PHASES.find(p => p.id === ph);
              return phase ? `<span class="badge" style="background: ${phase.color}22; color: ${phase.color}; border: 1px solid ${phase.color}44;">${phase.name}</span>` : '';
            }).join('')}
          </div>
        </div>
        <div class="detail-section detail-full">
          <h3>Bioresonance Application</h3>
          <p>${point.use}</p>
        </div>
        ${relatedItems.length ? `
          <div class="detail-section detail-full">
            <h3>Used In These Protocols</h3>
            <ul>
              ${relatedItems.map(i => `<li><strong>${i.name}</strong> (${i.sub}) - ${PHASES.find(p => p.id === i.phase).name}</li>`).join('')}
            </ul>
          </div>
        ` : ''}
      </div>
    </div>
  `;

  document.getElementById('detailPanel').classList.add('active');
  document.getElementById('detailOverlay').classList.add('active');
}

function renderDetail() {
  const item = state.selectedItem;
  if (!item) return;

  const phase = PHASES.find(p => p.id === item.phase);
  const relatedPoints = ACU_POINTS.filter(p => item.points.includes(p.code));
  const tab = state.detailTab;

  let tabContent = '';

  if (tab === 'overview') {
    tabContent = `
      <div class="detail-grid">
        <div class="detail-section detail-full">
          <h3>Description</h3>
          <p>${item.desc}</p>
        </div>
        <div class="detail-section">
          <h3>Resonance States</h3>
          <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;">
            ${item.states.map(s => `<span class="badge badge-${s}">${s}</span>`).join('')}
          </div>
          ${item.states.includes('confused') ? '<p style="font-size: 0.8rem; color: var(--confused);">The body may get confused about this - seeing beneficial as detrimental or vice versa. ASK the body and BALANCE if needed.</p>' : ''}
        </div>
        <div class="detail-section">
          <h3>Vial Location</h3>
          <p>${item.vial || 'Location to be added'}</p>
        </div>
        ${item.notes ? `
          <div class="detail-section detail-full" style="border-color: var(--gold-dim); background: rgba(201, 168, 76, 0.05);">
            <h3>Kelly's Notes</h3>
            <p style="font-style: italic;">${item.notes}</p>
          </div>
        ` : ''}
      </div>
    `;
  } else if (tab === 'testing') {
    tabContent = `
      <div class="detail-grid">
        ${item.test ? `
          <div class="detail-section detail-full">
            <h3>How to Test</h3>
            <p>${item.test}</p>
          </div>
        ` : '<div class="detail-section detail-full"><h3>Testing</h3><p>This item is primarily tested through direct body questioning (Asking mode).</p></div>'}
      </div>
    `;
  } else if (tab === 'asking') {
    tabContent = `
      <div class="detail-grid">
        ${item.ask ? `
          <div class="detail-section detail-full">
            <h3>How to Ask the Body</h3>
            <p>${item.ask}</p>
          </div>
        ` : '<div class="detail-section detail-full"><h3>Asking</h3><p>This item is primarily tested through vial/device resonance testing (Testing mode).</p></div>'}
      </div>
    `;
  } else if (tab === 'balance') {
    tabContent = `
      <div class="detail-grid">
        <div class="detail-section detail-full">
          <h3>How to Balance</h3>
          <p>${item.balance || 'Balance method to be added.'}</p>
        </div>
        ${item.remedies && item.remedies.length ? `
          <div class="detail-section detail-full">
            <h3>Recommended Support</h3>
            <ul>
              ${item.remedies.map(r => `<li>${r} - test for beneficial resonance before recommending</li>`).join('')}
            </ul>
          </div>
        ` : ''}
      </div>
    `;
  } else if (tab === 'acupuncture') {
    tabContent = `
      <div class="detail-grid">
        <div class="detail-section detail-full">
          <h3>Supporting Acupuncture Points</h3>
          <p style="margin-bottom: 16px; color: var(--cream-dim);">These points complement bioresonance treatment for ${item.name}. Click any point for full detail.</p>
          <div class="acu-grid">
            ${relatedPoints.map(p => renderAcuCard(p)).join('')}
          </div>
          ${!relatedPoints.length ? '<p style="color: var(--cream-dim);">No specific points mapped yet.</p>' : ''}
        </div>
      </div>
    `;
  }

  document.getElementById('detailContent').innerHTML = `
    <div class="detail-header">
      <div>
        <h2>${item.name}</h2>
        <div class="detail-sub">${phase.name} - ${item.sub}</div>
      </div>
      <button class="detail-close" onclick="hideDetail()">&times;</button>
    </div>
    <div class="detail-tabs">
      <button class="detail-tab ${tab === 'overview' ? 'active' : ''}" onclick="setDetailTab('overview')">Overview</button>
      <button class="detail-tab ${tab === 'testing' ? 'active' : ''}" onclick="setDetailTab('testing')">Testing</button>
      <button class="detail-tab ${tab === 'asking' ? 'active' : ''}" onclick="setDetailTab('asking')">Asking</button>
      <button class="detail-tab ${tab === 'balance' ? 'active' : ''}" onclick="setDetailTab('balance')">Balance & Support</button>
      <button class="detail-tab ${tab === 'acupuncture' ? 'active' : ''}" onclick="setDetailTab('acupuncture')">Acupuncture</button>
    </div>
    <div class="detail-content">
      ${tabContent}
    </div>
  `;
}

function hideDetail() {
  document.getElementById('detailPanel').classList.remove('active');
  document.getElementById('detailOverlay').classList.remove('active');
  state.selectedItem = null;
  state.selectedPoint = null;
}

function setDetailTab(tab) {
  state.detailTab = tab;
  renderDetail();
}

// ============================================================
// STATE MANAGEMENT
// ============================================================
function setPhase(phase) {
  state.phase = phase;
  renderFlowIndicator();
  renderPhaseNav();
  renderMain();
}

function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });
  renderMain();
}

// ============================================================
// EVENT LISTENERS
// ============================================================
document.getElementById('searchInput').addEventListener('input', (e) => {
  state.search = e.target.value.trim();
  renderMain();
});

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => setMode(btn.dataset.mode));
});

document.getElementById('detailOverlay').addEventListener('click', hideDetail);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') hideDetail();
});

// ============================================================
// INIT
// ============================================================
renderFlowIndicator();
renderPhaseNav();
renderMain();
</script>

</body>
</html>
