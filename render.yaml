services:
  - type: web
    name: bicom-optima
    runtime: static
    buildCommand: echo "Static site - no build needed"
    staticPublishPath: .
    envVars: []
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
